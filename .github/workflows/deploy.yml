name: Deploy Pelican site

on:
  push:
    branches:
      - main
  schedule:
    # Future-dated posts become publishable without requiring a manual push.
    # 18:17 UTC is 03:17 JST the following day.
    - cron: '17 18 * * *'

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          # exiftool をインストール
          sudo apt-get update && sudo apt-get install -y exiftool
          pip install -r requirements.txt

      - name: Remove Exif metadata
        run: |
          # content/images 内の全画像のExif情報を上書き削除
          exiftool -all= -overwrite_original -ignoreMinorErrors -r content/images/ || true

      - name: Build site
        run: |
          python scripts/prepare_build_content.py content .build-content
          pelican .build-content -o output -s publishconf.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
